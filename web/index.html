<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiAsset Core</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Mobile sidebar toggle -->
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="sidebar-logo-icon">&#9670;</span>
        <span class="sidebar-logo-text">DigiAsset Core</span>
      </div>
    </div>

    <ul class="sidebar-nav">
      <li>
        <a href="#/dashboard" data-route="dashboard" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>
      </li>
      <li>
        <a href="#/explorer" data-route="explorer" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Explorer
        </a>
      </li>
      <li>
        <a href="#/create" data-route="create" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          Create Asset
        </a>
      </li>
      <li>
        <a href="#/wallets" data-route="wallets" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          Wallets
        </a>
      </li>
      <li>
        <a href="#/node" data-route="node" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
          Node Status
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="sync-indicator" id="sync-indicator">
        <span class="sync-dot" id="sync-dot"></span>
        <span class="sync-text" id="sync-text">Connecting…</span>
      </div>
      <button class="auth-btn" id="auth-btn" title="Authentication">
        <svg class="auth-icon" id="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span id="auth-label">Authenticate</span>
      </button>
      <div class="version-text" id="version-text">DigiAsset Core</div>
    </div>
  </nav>

  <!-- Main content area -->
  <main id="content" class="content">
    <!-- Module content rendered here -->
  </main>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="auth-modal-title">Authenticate</h2>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Enter your DigiAsset Core RPC credentials. Credentials are held in memory only and lost on page refresh.</p>
        <div class="form-group">
          <label class="form-label" for="auth-username">Username</label>
          <input class="form-input" type="text" id="auth-username" autocomplete="username" placeholder="rpcuser" />
        </div>
        <div class="form-group">
          <label class="form-label" for="auth-password">Password</label>
          <input class="form-input" type="password" id="auth-password" autocomplete="current-password" placeholder="rpcpassword" />
        </div>
        <p class="auth-error hidden" id="auth-error"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="auth-cancel">Cancel</button>
        <button class="btn btn-primary" id="auth-submit">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/explorer.js"></script>
  <script src="js/modules/create.js"></script>
  <script src="js/modules/wallets.js"></script>
  <script src="js/modules/node.js"></script>

</body>
</html>
